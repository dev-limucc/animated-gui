plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// ---- multi-version target matrix --------------------------------------------
// Build one MC target with:  gradlew build "-Ptarget=<key>"      (default: 26.2)
// Build every target:        .\build-all.ps1                      (jars land in dist\)
// 'overlays' are extra client source dirs under src/client/versions/ holding the bits that differ
// between Minecraft eras (26.3 moved RenderPipeline/GpuTextureView/GpuSampler out of com.mojang.blaze3d).
def TARGETS = [
    '26.2': [range: '~26.2', loader: '0.19.3', loaderReq: '>=0.19.3', fapi: '0.154.2+26.2', modmenu: '20.0.0',
             overlays: ['render-blaze3d']],
    '26.3': [range: '~26.3', loader: '0.20.1', loaderReq: '>=0.20.1', fapi: '0.165.2+26.3', modmenu: '21.0.0',
             overlays: ['render-pearl']],
]

def targetVer = (findProperty('target') ?: '26.2').toString()
def t = TARGETS[targetVer]
if (t == null) throw new GradleException("Unknown -Ptarget=${targetVer}. Known targets: ${TARGETS.keySet()}")

version = "${project.mod_version}+mc${targetVer}"
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "animatedgui" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Client gametest (runClientGameTest): src/gametest. Never packaged into the release jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "animatedgui-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// version-specific source overlays (render-API facade + the mixins whose descriptors differ)
t.overlays.each { sourceSets.client.java.srcDir "src/client/versions/${it}/java" }

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetVer}"
    implementation "net.fabricmc:fabric-loader:${t.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${t.fapi}"
    implementation "maven.modrinth:modmenu:${t.modmenu}"

    // MixinExtras: @ModifyReturnValue / @WrapOperation give precise, low-overhead hot-path injections.
    // Fabric Loader bundles MixinExtras at runtime, so we only need it at compile time.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

// ---- production run: launch the BUILT jar in a real (non-dev) client -----------------------------------------
// gradlew runProductionClient "-Ptarget=26.2" ["-PprodWorld=<save folder under build/run/production/saves>"]   (close the window yourself)
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${t.fapi}"
}
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('jar')
    mods.from(configurations.productionMods)
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    minecraftVersion = targetVer
    runDir = layout.buildDirectory.dir('run/production')
    if (findProperty('prodWorld')) {
        programArgs.addAll('--quickPlaySingleplayer', findProperty('prodWorld').toString())
    }
}

processResources {
    def props = [
        version   : project.version.toString(),
        mc_range  : t.range,
        loader_req: t.loaderReq,
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
